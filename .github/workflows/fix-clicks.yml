name: Fix broken site clicks
on:
  push:
    paths:
      - '.github/workflows/fix-clicks.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          bad="nav('jobs');});});});\n\n$('#adminLoginForm')"
          good="nav('jobs');});});\n\n$('#adminLoginForm')"
          if bad not in s:
              raise SystemExit('Expected broken sequence not found')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix JavaScript syntax blocking site buttons"
          git push
