name: Launch fixes

on:
  push:
    paths:
      - '.github/workflows/inject-supabase-data.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply launch fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '#v12-shell,#v11-security,#v13-online{display:none!important;}' not in s:
              s = s.replace('#v12-shell{display:none!important;}', '#v12-shell,#v11-security,#v13-online{display:none!important;}', 1)

          replacements = {
            "x.jobId===id": "String(x.jobId)===String(id)",
            "x=>x.id===id": "x=>String(x.id)===String(id)",
            "selectedJob=jobs.find(j=>j.id===id)": "selectedJob=jobs.find(j=>String(j.id)===String(id))",
            "openJob(+b.dataset.job)": "openJob(b.dataset.job)",
            "toggleSaved(+b.dataset.saveJob)": "toggleSaved(b.dataset.saveJob)",
            "selectedJob?.id===id": "String(selectedJob?.id)===String(id)",
            "currentUser.role==='meseriaș'?'Meseriaș':'Client'": "currentUser.role==='meseriaș'?'Meseriaș verificat':'Client verificat'",
            "<b>Client: ${owner?.name||'Client'}</b>": "<b>✅ Client verificat: ${owner?.name||'Client'}</b>",
            "Control monetizare demo.": "Control monetizare.",
            "Rezumat venituri demo": "Rezumat venituri",
            "Încasări simulate:": "Încasări:",
            "Istoric complet al plăților simulate.": "Istoric plăți."
          }
          for old,new in replacements.items():
            s = s.replace(old,new)

          old = "$('#postJobBtn').onclick=()=>currentUser?.role==='client'?nav('post'):nav('auth');"
          new = "$('#postJobBtn').onclick=async()=>{try{const {data}=await supabaseClient.auth.getSession();if(data?.session?.user){nav('post');return;}}catch(e){}nav('auth');};"
          s = s.replace(old,new)

          versions = {
            'supabase-data.js':'20260910-2',
            'supabase-bridge.js':'20260910-2',
            'auth-entry.js':'20260910-3',
            'supabase-jobs.js':'20260910-2'
          }
          for name,ver in versions.items():
            import re
            s = re.sub(rf'<script src="{re.escape(name)}(?:\?v=[^"]*)?"></script>', f'<script src="{name}?v={ver}"></script>', s)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix client post navigation and refresh scripts"
          git push
