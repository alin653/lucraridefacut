name: Inject Supabase data module

on:
  push:
    paths:
      - '.github/workflows/inject-supabase-data.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Supabase modules to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          data_tag = '<script src="supabase-data.js"></script>'
          bridge_tag = '<script src="supabase-bridge.js"></script>'
          if data_tag not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing </body> in index.html')
              s = s.replace('</body>', f'{data_tag}\n</body>', 1)
          if bridge_tag not in s:
              if data_tag in s:
                  s = s.replace(data_tag, data_tag + '\n' + bridge_tag, 1)
              else:
                  s = s.replace('</body>', f'{bridge_tag}\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Supabase bridge module"
          git push
