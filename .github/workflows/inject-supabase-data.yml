name: Launch fixes

on:
  push:
    paths:
      - '.github/workflows/inject-supabase-data.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply launch fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          forced="$('#postJobBtn').onclick=async()=>{try{const {data}=await supabaseClient.auth.getSession();if(data?.session?.user){nav('post');return;}}catch(e){}nav('auth');};"
          original="$('#postJobBtn').onclick=()=>currentUser?.role==='client'?nav('post'):nav('auth');"
          s=s.replace(forced,original)
          s=re.sub(r'<script src="(?:navigation-hotfix|nav-hotfix)\.js(?:\?v=[^"]*)?"></script>','',s)
          s=s.replace('</body>','<script src="nav-hotfix.js?v=20260910-1"></script>\n</body>',1)
          for name,ver in {'supabase-data.js':'20260910-3','supabase-bridge.js':'20260910-3','auth-entry.js':'20260910-4','supabase-jobs.js':'20260910-3'}.items():
              s=re.sub(rf'<script src="{re.escape(name)}(?:\?v=[^"]*)?"></script>',f'<script src="{name}?v={ver}"></script>',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then echo "No change needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load correct navigation hotfix"
          git push
