name: Inject Supabase data module

on:
  push:
    paths:
      - '.github/workflows/inject-supabase-data.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Supabase modules and cloud compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          data_tag = '<script src="supabase-data.js"></script>'
          bridge_tag = '<script src="supabase-bridge.js"></script>'
          if data_tag not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing </body> in index.html')
              s = s.replace('</body>', f'{data_tag}\n</body>', 1)
          if bridge_tag not in s:
              s = s.replace(data_tag, data_tag + '\n' + bridge_tag, 1)

          replacements = {
            "x.jobId===id": "String(x.jobId)===String(id)",
            "x=>x.id===id": "x=>String(x.id)===String(id)",
            "selectedJob=jobs.find(j=>j.id===id)": "selectedJob=jobs.find(j=>String(j.id)===String(id))",
            "openJob(+b.dataset.job)": "openJob(b.dataset.job)",
            "toggleSaved(+b.dataset.saveJob)": "toggleSaved(b.dataset.saveJob)",
            "selectedJob?.id===id": "String(selectedJob?.id)===String(id)"
          }
          for old,new in replacements.items():
              s = s.replace(old,new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Supabase job links and saved jobs"
          git push
