name: Format job budgets
on:
  push:
    paths:
      - '.github/workflows/ui-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch budget display
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function budgetNumber(jobOrBudget){const raw=typeof jobOrBudget==='string'?jobOrBudget:(jobOrBudget?.budget||'');const nums=(String(raw).replace(/\\./g,'').match(/\\d+(?:,\\d+)?/g)||[]).map(x=>Number(x.replace(',','.'))).filter(Number.isFinite);return nums.length?Math.max(...nums):0;}\nfunction clientPostingPrice"
          new="function budgetNumber(jobOrBudget){const raw=typeof jobOrBudget==='string'?jobOrBudget:(jobOrBudget?.budget||'');const nums=(String(raw).replace(/\\./g,'').match(/\\d+(?:,\\d+)?/g)||[]).map(x=>Number(x.replace(',','.'))).filter(Number.isFinite);return nums.length?Math.max(...nums):0;}\nfunction formatBudget(jobOrBudget){const n=budgetNumber(jobOrBudget);return n?new Intl.NumberFormat('ro-RO').format(n)+' lei':String(typeof jobOrBudget==='string'?jobOrBudget:(jobOrBudget?.budget||''));}\nfunction clientPostingPrice"
          if old not in s:
              raise SystemExit('budget helper marker not found')
          s=s.replace(old,new,1)
          s=s.replace('💰 ${j.budget}','💰 ${formatBudget(j.budget)}')
          s=s.replace('<span>Buget</span><b>${j.budget}</b>','<span>Buget</span><b>${formatBudget(j.budget)}</b>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for i,m in enumerate(re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I),1):
              tag=s[m.start():s.find('>',m.start())+1]
              if 'src=' in tag.lower():
                  continue
              Path(f'/tmp/script{i}.js').write_text(m.group(1),encoding='utf-8')
          PY
          set -e
          for f in /tmp/script*.js; do node --check "$f"; done
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Format job budgets in RON"
          git push
