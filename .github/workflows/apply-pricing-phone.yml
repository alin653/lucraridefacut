name: Apply RON pricing and phone flow
on:
  push:
    paths:
      - 'patch_pricing_phone.py'
      - '.github/workflows/apply-pricing-phone.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_pricing_phone.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Switch pricing to RON and protect client phone"
          git push
